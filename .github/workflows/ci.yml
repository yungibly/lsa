name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
      LSA_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/lsa
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$TARGET"
      - name: Install native musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
      - name: Rust tests
        run: cargo test --locked --all-targets --target "$TARGET"
      - name: Build release binaries and fixtures
        run: |
          cargo build --release --locked --examples --bins --target "$TARGET"
          "target/$TARGET/release/examples/fixtures"
      - name: Headless terminal checks
        run: |
          python3 tests/check_pty.py
          python3 tests/check_layout.py
          python3 tests/check_cache.py
          python3 tests/check_thumbnails.py
      - name: Package and test extracted binary
        run: python3 scripts/package.py --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: Rust 1.88 minimum and release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test declared minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --locked --all-targets
      - name: Test release validation and formula generation
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v
