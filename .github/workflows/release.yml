name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

# Serialize release publication and tap updates.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate --tag "$RELEASE_TAG"

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish checked release archives
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: target/packages
          merge-multiple: true
      - name: Verify checksums and render Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py prepare --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          ruby -c target/release-metadata/lsa.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: target/release-metadata/lsa.rb
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "lsa $RELEASE_TAG" --notes-file target/release-metadata/notes.md \
            target/packages/*.tar.gz target/packages/*.sha256 target/release-metadata/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest

  homebrew-test:
    name: Homebrew install (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - name: Find Linux Homebrew
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Install from published archive and test formula
        run: |
          tap="$(brew --repository)/Library/Taps/yungibly/homebrew-release-test"
          mkdir -p "$tap/Formula"
          cp formula/lsa.rb "$tap/Formula/lsa.rb"
          git -C "$tap" init
          brew install yungibly/release-test/lsa
          brew test yungibly/release-test/lsa

  homebrew:
    name: Update Homebrew tap
    needs: homebrew-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: formula
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yungibly/homebrew-tap
          token: ${{ secrets.BREWTAP_TOKEN }}
          path: tap
      - name: Commit formula update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp formula/lsa.rb tap/Formula/lsa.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/lsa.rb
          if git diff --cached --quiet; then
            echo 'Formula already up to date.'
            exit 0
          fi
          git commit -m "lsa $RELEASE_TAG"
          git pull --rebase
          git push
